# Nixpacks configuration for the Vite + React frontend.

providers = ["bun"]

[variables]
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bunx --bun serve dist --single --listen tcp://0.0.0.0:${PORT:-3000}"
